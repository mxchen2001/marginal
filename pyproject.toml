[tool.poetry]
name = "marginal"
version = "0.1.0"
description = "Prediction market trading bot"
authors = []
packages = [{include = "marginal"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
httpx = ">=0.27"
feedparser = ">=6.0"
supabase = ">=2.0"
anthropic = ">=0.40"
openai = ">=1.50"
praw = ">=7.7"
schedule = ">=1.2"
python-dotenv = ">=1.0"
tavily-python = ">=0.5"
numpy = ">=1.26"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
